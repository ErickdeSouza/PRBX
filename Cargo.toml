[package]
name = "apk-inspector"
version = "0.1.0"
edition = "2024"
default-run = "apk-inspector"

[dependencies]
anyhow = "1"
goblin = "0.10"
memmap2 = "0.9.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "2", default-features = false, features = ["deflate"] }
